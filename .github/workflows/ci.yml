name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "./.floor[dev]"
      - name: Policy
        run: python -m floor policy
      - name: Notices complete (F6)
        shell: bash
        run: |
          shopt -s nullglob
          files=(.floor/notices/[0-9]*.md)
          if [ ${#files[@]} -eq 0 ]; then echo "no notices"; else python -m floor notice "${files[@]}"; fi
      - name: Policy ratchet (F1.2)
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "${BASE_REF:-}" ]; then
            git fetch -q origin "$BASE_REF" && base="origin/$BASE_REF"
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}:.floor/policy.yml" 2>/dev/null; then
            base="$BEFORE"
          else
            echo "no earlier policy to compare with"; exit 0
          fi
          python -m floor ratchet --base "$base"
      - name: Floor page builds
        run: python -m floor page --out site
      - name: Unit tests
        run: python -m pytest .floor/tests -q
      # SCI (PRD F14.1): the committed Impact Framework manifests must match the evidence, and the
      # real if-run must give the committed SCI summary (floor footprint check recomputes each output).
      - name: SCI manifests match the evidence (F14.1)
        run: python -m floor footprint stale
      - uses: actions/setup-node@v4
        if: hashFiles('.floor/impact/sci-*.yml') != ''
        with:
          node-version: "22"
      - name: SCI with Impact Framework (F14.1)
        if: hashFiles('.floor/impact/sci-*.yml') != ''
        run: |
          npm install -g --no-fund --no-audit @grnsft/if@1.1.1
          mkdir -p out/impact
          for m in .floor/impact/sci-*.yml; do
            if-run --manifest "$m" --output "out/impact/$(basename "$m" .yml)"
          done
          python -m floor footprint check out/impact/*.yaml --expect .floor/evidence/footprint/sci.json
      - name: Hygiene guard
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          bash scripts/guard.sh tree
          if [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            commits="$(git rev-list "${BEFORE}..${GITHUB_SHA}")"
          else
            commits="${GITHUB_SHA}"
          fi
          for c in $commits; do
            git log -1 --format=%B "$c" | bash scripts/guard.sh msg - || { echo "bad commit message: $c"; exit 1; }
          done
