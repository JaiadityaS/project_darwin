# Rieux release gate for whisper.cpp (PRD §7.1, task T-47, DECISIONS D-014).
# Every pipeline proves the CPU floor of the image that .devops/main.Dockerfile builds: a static
# scan of every ELF file (the proof) and whisper-cli runs under QEMU on old CPU models (the
# corroboration). The Judge, a script, decides. No LLM output sets a floor status.
#
#   check   policy, notices, ratchet, agent path allowlist (merge requests), unit tests
#   build   builds and pushes the image with upstream's recipe; records the build machine
#   scan    static CPU-floor scan of /app in the pushed image
#   probe   whisper-cli from the pushed image under QEMU, one job per CPU model, with controls
#   memory  whisper-cli from the pushed image under cgroup memory limits, no swap, per model size
#   offline whisper-cli from the pushed image with no network, under strace
#   service the service image (pushed image + gateway) with the real whisper-server: a smoke test (F13.3)
#   judge   floor judge and floor manifest; fails the pipeline when a floor rises
#   fallback      only after a failed judge: the canned inclusive config as a patch for the branch (F4.3)
#   notice-draft  only after a failed judge: drafts the Leave-Behind Notice for a code owner (F4.5)
#   attest  only after a passed judge: signs the manifest on the image digest, keyless (F5.4)
#   herald  after attest: "Who this release serves" and the pinned-issue summary, from the manifest (F12.1, F12.3)
#   release default branch, after attest: cuts <tag>-floor.N when the commit merged a fix of a tag (F4.4)
#   pages   the Rieux page from the committed evidence (default branch only)
#
# Evidence: the artifacts below out/ (the judge job keeps all of them).
# SCI per release check (R2): each job that uses the tools image meters its own container, and
# the judge job adds the meters into out/judge/meter.json (DECISIONS D-015).
# Not here yet: the agent part of herald (T-04), deploy.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    # The release job made this tag, after the pipeline of the same commit proved and signed it (D-024).
    - if: $CI_COMMIT_TAG =~ /-floor\.[0-9]+$/
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [check, build, floors, judge, repair, publish]

variables:
  IMAGE_REPO: $CI_REGISTRY_IMAGE/main
  # The first 12 hex digits of the SHA-256 of .gitlab/ci/tools.Dockerfile (check.sh compares them).
  TOOLS_TAG: "348395c3ee88"
  # GitLab usernames of the humans, space-separated. Every other pipeline user counts as an agent.
  FLOOR_HUMANS: "jaiadityasinghr"
  # The IID of the pinned issue that gets the release summary (F12.3, D-032). Empty: the flow posts nothing.
  FLOOR_SUMMARY_ISSUE: ""
  # Reference transcript of samples/jfk.wav.
  EXPECT: "ask not what your country can do for you"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: "ignore"
  PIP_PROGRESS_BAR: "off"

default:
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, scheduler_failure, api_failure]

.evidence:
  artifacts:
    when: always
    expire_in: 90 days

.tools:
  image: $CI_REGISTRY_IMAGE/tools:$TOOLS_TAG
  variables:
    GIT_DEPTH: "1"
  # Editable install: the package finds policy.yml and the evidence through its own path.
  # Then the R2 meter (D-015): CPU time and memory of this job's cgroup until the job shell ends.
  # The EXIT trap also runs after a failed command. The meter never changes a floor or a job result.
  before_script:
    - pip install -q -e ./.floor
    - |
      meter_state=/tmp/floor-meter/state.json
      meter_out="$CI_PROJECT_DIR/out/meter/$(echo "$CI_JOB_NAME_SLUG" | sed 's/--*/-/g').json"
      floor meter start --cgroup --state "$meter_state" || echo "floor meter did not start: R2 has no value for this job"
      trap 'floor meter stop --state "$meter_state" --evidence "$CI_JOB_URL" --out "$meter_out" || true' EXIT

check:
  stage: check
  extends: .evidence
  image: python:3.12-slim
  needs: []
  variables:
    GIT_DEPTH: "0"
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - pip install -q -e "./.floor[dev]"
    - floor policy
    - sh .gitlab/ci/check.sh
    - python -m pytest .floor/tests -q --junitxml=out/check/junit.xml
  artifacts:
    paths: [out/check/]
    reports:
      junit: out/check/junit.xml

build:
  stage: build
  extends: .evidence
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--registry-mirror", "https://mirror.gcr.io"]
  needs: []
  timeout: 75m
  variables:
    GIT_DEPTH: "1"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  script:
    - |
      for i in $(seq 1 30); do docker info > /dev/null 2>&1 && break; sleep 2; done
      docker info --format 'docker {{.ServerVersion}}, {{.NCPU}} CPUs'
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      # The tools image, once per recipe.
      tools="$CI_REGISTRY_IMAGE/tools:$TOOLS_TAG"
      if docker manifest inspect "$tools" > /dev/null 2>&1; then
        echo "tools image $tools exists"
      else
        docker build --pull -f .gitlab/ci/tools.Dockerfile -t "$tools" .gitlab/ci
        docker push "$tools"
      fi
    - |
      # The release image, with upstream's recipe. Nothing may write into the build context
      # while it builds, so the log goes to /tmp first.
      ref="$IMAGE_REPO:$CI_COMMIT_SHA"
      if ! docker build --pull --progress=plain -f .devops/main.Dockerfile -t "$ref" . > /tmp/build.log 2>&1; then
        mkdir -p out/build && cp /tmp/build.log out/build/build.log
        tail -n 60 /tmp/build.log
        exit 1
      fi
      tail -n 15 /tmp/build.log
      docker push "$ref"
    - |
      # Evidence: the image digest, the base image digest (from the build log), the build machine.
      mkdir -p out/build
      cp /tmp/build.log out/build/build.log
      digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REPO:$CI_COMMIT_SHA")"
      digest="${digest#*@}"
      case "$digest" in sha256:*) ;; *) echo "no registry digest for $IMAGE_REPO:$CI_COMMIT_SHA"; exit 1 ;; esac
      stage="$(grep -iE '^FROM ' .devops/main.Dockerfile | tail -n 1 | awk 'tolower($(NF-1)) == "as" { print $NF }')"
      base="$(grep -E "\[${stage:-[^]]+} 1/[0-9]+\] FROM " /tmp/build.log | grep -oE '[^ ]+@sha256:[0-9a-f]{64}' | tail -n 1 || true)"
      if [ -z "$base" ]; then
        # BuildKit prints one FROM step for stages with the same base image.
        base="$(grep -oE 'FROM [^ ]+@sha256:[0-9a-f]{64}' /tmp/build.log | tail -n 1 | cut -d ' ' -f 2 || true)"
      fi
      sh .gitlab/ci/facts.sh > out/build/runner.txt 2>&1
      sh .gitlab/ci/facts.sh --cpu > out/build/cpu.txt
      {
        echo "IMAGE_REF=$IMAGE_REPO@$digest"
        echo "IMAGE_DIGEST=$digest"
        if [ -n "$base" ]; then echo "BASE_IMAGE=$base"; fi
      } > out/build/image.env
      cat out/build/image.env
      echo "build machine: $(cat out/build/cpu.txt)"
  artifacts:
    paths: [out/build/]
    reports:
      dotenv: out/build/image.env

# F13.3 (T-52, D-019): the service image is the pushed image plus the gateway. The job runs it with
# the real whisper-server and checks the upload path: samples/jfk.wav gives the reference text, and
# a body that is not WAV gets 400. It pushes nothing; the deploy jobs (T-51) build it again.
service:
  stage: floors
  extends: .evidence
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--registry-mirror", "https://mirror.gcr.io"]
  needs: [build]
  timeout: 30m
  variables:
    GIT_DEPTH: "1"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  script:
    - |
      for i in $(seq 1 30); do docker info > /dev/null 2>&1 && break; sleep 2; done
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      mkdir -p out/service
      echo "$CI_JOB_URL" > out/service/job-url.txt
      # The CPU of this job: the image may stop on a runner that is older than the build runner (H-1).
      sh .gitlab/ci/facts.sh --cpu | tee out/service/cpu.txt
      docker build --progress=plain -f deploy/service.Dockerfile --build-arg IMAGE="$IMAGE_REF" -t rieux-service . \
        > /tmp/service-build.log 2>&1 || { tail -n 40 /tmp/service-build.log; exit 1; }
      cp /tmp/service-build.log out/service/build.log
      docker run -d --name rieux-service -p 8080:8080 rieux-service
      ok=0
      for i in $(seq 1 90); do
        if wget -q -O /dev/null http://docker:8080/healthz 2>/dev/null; then ok=1; break; fi
        sleep 2
      done
      if [ "$ok" != 1 ]; then
        docker inspect -f 'container {{.State.Status}}, exit code {{.State.ExitCode}}' rieux-service || true
        docker logs rieux-service > out/service/service.log 2>&1 || true
        tail -n 40 out/service/service.log
        exit 1
      fi
      # curl, not BusyBox wget: its post-file option sets Content-Length with strlen(), so it cuts binary
      # data at the first zero byte (pipeline 2960896128 got 400 for jfk.wav).
      apk add --no-cache curl > /dev/null
      code=$(curl -sS -o out/service/transcribe.json -w '%{http_code}' -H "Content-Type: audio/wav" \
        --data-binary @samples/jfk.wav http://docker:8080/transcribe)
      cat out/service/transcribe.json; echo
      [ "$code" = 200 ] || { echo "HTTP $code"; docker logs rieux-service 2>&1 | tail -n 40; exit 1; }
      grep -qi "$EXPECT" out/service/transcribe.json || { echo "the text does not match: $EXPECT"; exit 1; }
      # F13.4 (D-028): the host level and the ggml CPU variant that whisper-server loaded, from its log.
      curl -sS -o out/service/floor.json http://docker:8080/floor
      cat out/service/floor.json; echo
      grep -q '"host_level": "x86-64-v' out/service/floor.json || { echo "GET /floor has no host level"; exit 1; }
      # A body that is not 16 kHz mono WAV never reaches whisper-server (the unit tests check 413 and 429).
      head -c 500000 /dev/zero > /tmp/not-wav.bin
      code=$(curl -sS -o /tmp/bad.json -w '%{http_code}' --data-binary @/tmp/not-wav.bin http://docker:8080/transcribe)
      [ "$code" = 400 ] || { echo "a body that is not WAV got HTTP $code"; cat /tmp/bad.json; exit 1; }
      echo "not WAV: 400 $(cat /tmp/bad.json)"
      docker logs rieux-service > out/service/service.log 2>&1
      docker rm -f rieux-service > /dev/null
  artifacts:
    paths: [out/service/]

scan:
  stage: floors
  extends: [.tools, .evidence]
  needs: [build]
  script:
    - mkdir -p out/scan rootfs
    - echo "$CI_JOB_URL" > out/scan/job-url.txt
    - sh .gitlab/ci/facts.sh > out/scan/runner.txt 2>&1
    - echo "$CI_REGISTRY_PASSWORD" | crane auth login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - crane export "$IMAGE_REF" - | tar -x -C rootfs
    - floor scan rootfs/app --json out/scan/scan.json | tee out/scan/scan.txt
    - |
      # The CMake flags in effect (the cache records defaults too, for example GGML_NATIVE).
      sed -n -E 's/^(GGML_NATIVE|GGML_BACKEND_DL|GGML_CPU_ALL_VARIANTS|BUILD_SHARED_LIBS|CMAKE_BUILD_TYPE|GGML_SSE42|GGML_AVX[A-Z0-9_]*|GGML_FMA|GGML_F16C|GGML_BMI2):[A-Z]+=(.*)$/-D\1=\2/p' \
        rootfs/app/build/CMakeCache.txt | tr '\n' ' ' | sed 's/ *$//' > out/scan/cmake-flags.txt
      echo "cmake flags: $(cat out/scan/cmake-flags.txt)"
  artifacts:
    paths: [out/scan/, out/meter/]

probe:
  stage: floors
  extends: [.tools, .evidence]
  needs: [build]
  timeout: 55m
  parallel:
    matrix:
      - CPU_MODEL: [qemu64, Nehalem, SandyBridge, EPYC-Milan]
  cache:
    key: models-tiny.en-c78c86eb
    paths: [.cache/models/]
  script:
    - mkdir -p out/probe rootfs
    - sh .gitlab/ci/model.sh tiny.en
    - echo "$CI_REGISTRY_PASSWORD" | crane auth login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - crane export "$IMAGE_REF" - | tar -x -C rootfs
    - |
      # The image is the sysroot (qemu -L). Paths that exist in it, such as /app/samples, come from it.
      # -t 2: the runner has 2 vCPUs. ggml threads spin at each barrier, so more threads than vCPUs
      # waste emulated CPU time (MR pipeline 2961002610: EPYC-Milan timed out at 1800 s with -t 4).
      # -ac 768: an audio context of 15.36 s, which holds the 11 s sample. The encoder (about 80% of
      # the emulated time) then does about half the work. On the GitLab runners the AVX variants run
      # slowly under QEMU (MR pipeline 2961093570: EPYC-Milan timed out at 2400 s; D-027).
      floor probe --cpu "$CPU_MODEL" --sysroot "$PWD/rootfs" --expect "$EXPECT" --timeout 2700 \
        --label "$CI_COMMIT_SHORT_SHA" --out "out/probe/$CPU_MODEL.json" -- \
        "$PWD/rootfs/app/build/bin/whisper-cli" -m "$PWD/.cache/models/ggml-tiny.en.bin" \
        -f /app/samples/jfk.wav -ac 768 -t 2 -nt | tee "out/probe/$CPU_MODEL.txt"
  artifacts:
    paths: [out/probe/, out/meter/]

# The memory and offline jobs run the image's own binaries natively, with chroot into the
# exported image, so the image's libraries load. The job container runs as root, has cgroup v2
# and no systemd (STATE.md "Facts learned"), so floor memory makes the cgroups itself (--cgroup).
# A container runtime gives the image a /proc, and chroot does not. With GGML_BACKEND_DL=ON (the canned
# config), ggml finds its CPU backends through /proc/self/exe; without /proc it finds none and aborts
# (MR pipeline 2961002610). So both jobs mount /proc in the exported image first.
memory:
  stage: floors
  extends: [.tools, .evidence]
  needs: [build]
  timeout: 45m
  variables:
    MEMORY_MODELS: "tiny.en base.en small.en"
  cache:
    key: models-tiny.en-base.en-small.en
    paths: [.cache/models/]
  script:
    - mkdir -p out/memory rootfs
    - echo "$CI_JOB_URL" > out/memory/job-url.txt
    - for m in $MEMORY_MODELS; do sh .gitlab/ci/model.sh "$m"; done
    - echo "$CI_REGISTRY_PASSWORD" | crane auth login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - crane export "$IMAGE_REF" - | tar -x -C rootfs
    - mkdir -p rootfs/proc && mount -t proc proc rootfs/proc  # see the comment above the memory job
    - |
      # The download size of each model's run (F8.1): the model, whisper-cli and its libraries.
      mkdir -p rootfs/models
      set -- --artifact rootfs/app/build/bin/whisper-cli
      for f in $(find rootfs/app/build/bin -name '*.so*' -type f); do set -- "$@" --artifact "$f"; done
      for m in $MEMORY_MODELS; do
        ln -f ".cache/models/ggml-$m.bin" rootfs/models/ 2> /dev/null || cp ".cache/models/ggml-$m.bin" rootfs/models/
        floor memory --cgroup --model "${m%.en}" --expect "$EXPECT" --timeout 300 --out "out/memory/${m%.en}.json" \
          --artifact "rootfs/models/ggml-$m.bin" "$@" -- \
          chroot "$PWD/rootfs" /app/build/bin/whisper-cli -m "/models/ggml-$m.bin" -f /app/samples/jfk.wav -t 4 -nt \
          | tee -a out/memory/memory.txt
      done
  artifacts:
    paths: [out/memory/, out/meter/]

offline:
  stage: floors
  extends: [.tools, .evidence]
  needs: [build]
  timeout: 30m
  cache:
    key: models-tiny.en-c78c86eb
    paths: [.cache/models/]
    policy: pull
  script:
    - mkdir -p out/offline rootfs
    - echo "$CI_JOB_URL" > out/offline/job-url.txt
    - sh .gitlab/ci/model.sh tiny.en
    - echo "$CI_REGISTRY_PASSWORD" | crane auth login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - crane export "$IMAGE_REF" - | tar -x -C rootfs
    - mkdir -p rootfs/proc && mount -t proc proc rootfs/proc  # see the comment above the memory job
    - |
      # A new network namespace (only a down loopback), and strace on connect, sendto and sendmsg.
      mkdir -p rootfs/models
      ln -f .cache/models/ggml-tiny.en.bin rootfs/models/ 2> /dev/null || cp .cache/models/ggml-tiny.en.bin rootfs/models/
      set -- --artifact rootfs/models/ggml-tiny.en.bin --artifact rootfs/app/build/bin/whisper-cli
      for f in $(find rootfs/app/build/bin -name '*.so*' -type f); do set -- "$@" --artifact "$f"; done
      floor offline --no-sudo --expect "$EXPECT" --timeout 600 --out out/offline/offline.json "$@" -- \
        chroot "$PWD/rootfs" /app/build/bin/whisper-cli -m /models/ggml-tiny.en.bin -f /app/samples/jfk.wav -t 4 -nt \
        | tee out/offline/offline.txt
  artifacts:
    paths: [out/offline/, out/meter/]

judge:
  stage: judge
  extends: [.tools, .evidence]
  needs: [build, scan, probe, memory, offline]
  script:
    - |
      mkdir -p out/judge
      echo "$CI_JOB_URL" > out/judge/job-url.txt
      set --
      for f in out/probe/*.json; do
        if [ -e "$f" ]; then set -- "$@" --probe "$f"; fi
      done
      for f in out/memory/*.json; do
        if [ -e "$f" ]; then set -- "$@" --memory "$f"; fi
      done
      if [ -e out/offline/offline.json ]; then set -- "$@" --connectivity out/offline/offline.json; fi
      rc=0
      floor judge --scan out/scan/scan.json "$@" --out out/judge/judge.json > out/judge/judge.txt || rc=$?
      cat out/judge/judge.txt
      # Each floor links the job that measured it (PRD §11.1). The pipeline is the link for the others.
      set --
      for pair in scan=cpu memory=memory offline=connectivity; do
        f="out/${pair%%=*}/job-url.txt"
        if [ -s "$f" ]; then set -- "$@" --floor-evidence "${pair#*=}=$(cat "$f")"; fi
      done
      # T-54: the SCI values come from the committed footprint summary (floor footprint check --out).
      sci=.floor/evidence/footprint/sci.json
      if [ -s "$sci" ]; then set -- "$@" --footprint "$sci"; fi
      floor manifest --judge out/judge/judge.json --scan out/scan/scan.json \
        --subject "$IMAGE_REPO" --digest "$IMAGE_DIGEST" \
        --release "${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA}" --commit "$CI_COMMIT_SHA" \
        --cmake-flags "$(cat out/scan/cmake-flags.txt)" ${BASE_IMAGE:+--base-image "$BASE_IMAGE"} \
        --build-cpu "$(cat out/build/cpu.txt)" --evidence "$CI_PIPELINE_URL" "$@" \
        --out out/judge/floor-manifest.json --diff out/judge/diff.md > /dev/null
      cat out/judge/diff.md
      # R2 (D-015): stop the meter of this job, then add the meters of all the jobs of the release check.
      trap - EXIT
      floor meter stop --state "$meter_state" --evidence "$CI_JOB_URL" --out "$meter_out" || true
      floor meter join out/meter/*.json --evidence "$CI_PIPELINE_URL" --out out/judge/meter.json \
        || echo "floor meter join: no R2 value for this pipeline"
      exit "$rc"
  artifacts:
    paths: [out/]

# F4.3: the gate failed, so a script (not the agent) makes the canned inclusive config for this branch.
# CI has no token that can push (D-010, D-018): the patch is an artifact in the MR widget. The flow or a
# human commits it with git apply, and the next pipeline of the branch is the gate's re-check. When the
# branch already has the canned config, the job writes no patch, and notice-draft writes the draft.
fallback:
  stage: repair
  extends: .evidence
  image: python:3.12-slim
  needs: [judge]
  when: on_failure
  variables:
    GIT_DEPTH: "1"
  script:
    - |
      if [ ! -s out/judge/judge.json ]; then echo "no fallback: the judge wrote no result"; exit 0; fi
      pip install -q -e ./.floor
      floor fallback --judge out/judge/judge.json --patch out/fallback/fallback.patch
      # The floor-repair flow reads job logs, not artifacts (T-40), so the log carries the patch too.
      if [ -s out/fallback/fallback.patch ]; then
        echo "--- BEGIN fallback.patch ---"; cat out/fallback/fallback.patch; echo "--- END fallback.patch ---"
      fi
  artifacts:
    expose_as: Canned config patch
    paths: [out/fallback/]

# F4.5: the fix and the canned config (F4.3) did not hold a floor, so the repair loop stops.
# A script drafts the Leave-Behind Notice from the judge result and the MR description. CI has
# no token to open the notice MR (D-010): the draft is an artifact in the MR widget, and a code
# owner opens the notice MR. floor notice-draft writes nothing while the fallback can still run.
notice-draft:
  stage: repair
  extends: .evidence
  image: python:3.12-slim
  needs: [judge]
  when: on_failure
  variables:
    GIT_DEPTH: "1"
  script:
    - |
      if [ ! -s out/judge/judge.json ]; then echo "no draft: the judge wrote no result"; exit 0; fi
      pip install -q -e ./.floor
      set --
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        printf '%s\n' "$CI_MERGE_REQUEST_DESCRIPTION" > /tmp/mr.md
        set -- --diagnosis /tmp/mr.md --mr "$CI_MERGE_REQUEST_PROJECT_URL/-/merge_requests/$CI_MERGE_REQUEST_IID"
        if [ "$CI_MERGE_REQUEST_DESCRIPTION_IS_TRUNCATED" = "true" ]; then set -- "$@" --truncated; fi
      fi
      floor notice-draft --judge out/judge/judge.json --evidence "$CI_PIPELINE_URL" "$@" --out out/notice
  artifacts:
    # expose_as: no glob and no variable in the path; a directory path ends with /.
    expose_as: Leave-Behind Notice draft
    paths: [out/notice/]

# F5.4 (T-34, D-023): the gate passed, so cosign signs the Floor Manifest as an in-toto attestation on the
# image digest. Keyless: cosign trades this job's GitLab ID token for a short-lived Sigstore certificate
# for this pipeline definition at this ref, and the public Rekor log records the signature. Then the job
# verifies the attestation with that exact identity and compares it with the manifest (floor attest check).
# cosign v2 keeps the attestation in the registry next to the image (a .att tag), which every registry can store.
attest:
  stage: publish
  extends: .evidence
  image: python:3.12-slim
  needs: [build, judge]
  interruptible: false
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    GIT_DEPTH: "1"
    COSIGN_VERSION: "2.6.5"
    COSIGN_SHA256: "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644"
  script:
    - pip install -q -e ./.floor
    - |
      url="https://github.com/sigstore/cosign/releases/download/v$COSIGN_VERSION/cosign-linux-amd64"
      python3 -c 'import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])' "$url" /usr/local/bin/cosign
      echo "$COSIGN_SHA256  /usr/local/bin/cosign" | sha256sum -c -
      chmod +x /usr/local/bin/cosign
      cosign version 2>&1 | grep -E '^GitVersion'
    - |
      mkdir -p out/attest
      echo "$CI_JOB_URL" > out/attest/job-url.txt
      type="$(floor attest predicate --manifest out/judge/floor-manifest.json --out out/attest/predicate.json)"
      identity="$(floor attest identity)"
      echo "predicate type: $type"
      echo "signer identity: $identity"
      echo "$CI_REGISTRY_PASSWORD" | cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
      cosign attest --yes --type "$type" --predicate out/attest/predicate.json "$IMAGE_REF"
      cosign verify-attestation --type "$type" --certificate-identity "$identity" \
        --certificate-oidc-issuer "$CI_SERVER_URL" "$IMAGE_REF" > out/attest/verified.jsonl
      floor attest check --manifest out/judge/floor-manifest.json --verified out/attest/verified.jsonl
      # Anyone can repeat the check with this command.
      printf 'cosign verify-attestation --type %s --certificate-identity %s --certificate-oidc-issuer %s %s\n' \
        "$type" "$identity" "$CI_SERVER_URL" "$IMAGE_REF" | tee out/attest/verify.txt
  artifacts:
    paths: [out/attest/]

# F12.1 (T-46, D-025): "Who this release serves" from the signed manifest. A template, so every value in it
# comes from the manifest. The agent summary (Duo CLI, T-04) is not here yet.
# F12.3 (T-61, D-032): the pinned-issue summary, at most 7 lines. CI has no token that can post a note, so the
# job log carries it, and the release-summary flow copies it to the pinned issue after a release.
herald:
  stage: publish
  extends: .evidence
  image: python:3.12-slim
  needs: [judge, attest]
  variables:
    GIT_DEPTH: "1"
  script:
    - pip install -q -e ./.floor
    - floor herald --manifest out/judge/floor-manifest.json --out out/herald/who.md
    - floor summary --manifest out/judge/floor-manifest.json --who out/herald/who.md --out out/herald/summary.md > /dev/null
    - 'echo "summary issue: $FLOOR_SUMMARY_ISSUE"'
    - echo "--- BEGIN summary ---"; cat out/herald/summary.md; echo "--- END summary ---"
  artifacts:
    paths: [out/herald/]

# F4.4 (T-42, D-024): a fix MR merged and the gate held again, so cut <tag>-floor.N from the merged commit.
# floor release finds the fix MR of this commit and the tag pipeline that the fix repaired. Any other
# commit gets no release. The Releases API makes the tag from ref, with CI_JOB_TOKEN (D-010).
release:
  stage: publish
  extends: .evidence
  image: python:3.12-slim
  needs: [judge, attest, herald]
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "1"
  script:
    - pip install -q -e ./.floor
    - |
      floor release --sha "$CI_COMMIT_SHA" --default-branch "$CI_DEFAULT_BRANCH" \
        --api "$CI_API_V4_URL" --project "$CI_PROJECT_ID" \
        --diff out/judge/diff.md --verify out/attest/verify.txt --herald out/herald/who.md \
        --link "Floor Manifest=$(cat out/judge/job-url.txt)/artifacts/file/out/judge/floor-manifest.json" \
        --link "Signature check=$(cat out/attest/job-url.txt)/artifacts/file/out/attest/verify.txt" \
        --out out/release/release.json
  artifacts:
    paths: [out/release/]

pages:
  stage: publish
  image: python:3.12-slim
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - pip install -q -e ./.floor
    - floor page --out public
  artifacts:
    paths: [public]
