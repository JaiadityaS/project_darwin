[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floor"
version = "0.1.0"
description = "Proves, for every release, who can still use it."
readme = "overrides/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "iced-x86>=1.21",
  "pyelftools>=0.31",
  "requests>=2.31",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
floor = "floor.cli:main"

[tool.setuptools.packages.find]
include = ["floor*"]

[tool.setuptools.package-data]
floor = ["gateway.html", "page_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
