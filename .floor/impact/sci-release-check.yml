# Made by `python -m floor footprint write` from https://gitlab.com/gitlab-ai-hackathon/transcend-october-2026/43085222/showcase/-/pipelines/2960804030.
# Do not edit. Change the evidence or .floor/impact/footprint.yml, then run the command again.
# CI runs if-run (@grnsft/if@1.1.1) on this file and checks every output (F14.1).
name: floor-sci-release-check
description: 'SCI per release check (R2): every Floor probe of one release. CPU time and memory: `floor meter` (the
  cgroup of each job container), the sum of 8 jobs (judge, memory, offline, probe-epyc-milan, probe-nehalem, probe-qemu64,
  probe-sandybridge, scan), on INTEL(R) XEON(R) PLATINUM 8581C CPU @ 2.10GHz with 2 vCPUs. Watts: Emerald Rapids
  (CCF gcp table). Site: a GitLab-hosted runner in us-east1. The n2d-standard host is an assumption. No repair agent
  ran, so agent tokens add 0.'
tags:
  kind: sci
  category: release-checks
initialize:
  plugins:
    vcpu-seconds:
      method: Multiply
      path: builtin
      config:
        input-parameters:
        - cpu/vcpus
        - duration
        output-parameter: cpu/vcpu-seconds
    watts-delta:
      method: Subtract
      path: builtin
      config:
        input-parameters:
        - cpu/watts-max
        - cpu/watts-min
        output-parameter: cpu/watts-delta
    cpu-idle:
      method: Multiply
      path: builtin
      config:
        input-parameters:
        - cpu/vcpu-seconds
        - cpu/watts-min
        output-parameter: cpu/idle-joules
    cpu-load:
      method: Multiply
      path: builtin
      config:
        input-parameters:
        - cpu/busy-seconds
        - cpu/watts-delta
        output-parameter: cpu/load-joules
    memory:
      method: Multiply
      path: builtin
      config:
        input-parameters:
        - memory/gb-seconds
        - memory/watts-per-gb
        output-parameter: memory/joules
    it-energy:
      method: Sum
      path: builtin
      config:
        input-parameters:
        - cpu/idle-joules
        - cpu/load-joules
        - memory/joules
        output-parameter: it/joules
    facility-energy:
      method: Multiply
      path: builtin
      config:
        input-parameters:
        - it/joules
        - pue
        output-parameter: facility/joules
    energy-kwh:
      method: Divide
      path: builtin
      config:
        numerator: facility/joules
        denominator: 3600000
        output: energy
    operational-carbon:
      method: Multiply
      path: builtin
      config:
        input-parameters:
        - energy
        - grid/carbon-intensity
        output-parameter: carbon-operational
    host-share:
      method: Divide
      path: builtin
      config:
        numerator: cpu/vcpus
        denominator: host/vcpus
        output: usage-ratio
    embodied-carbon:
      method: SciEmbodied
      path: builtin
      config:
        baseline-emissions: 2321460.0
        lifespan: 126144000
    carbon:
      method: Sum
      path: builtin
      config:
        input-parameters:
        - carbon-operational
        - embodied-carbon
        output-parameter: carbon
    sci:
      method: Sci
      path: builtin
      config:
        functional-unit: release-checks
tree:
  children:
    release-check:
      pipeline:
        compute:
        - vcpu-seconds
        - watts-delta
        - cpu-idle
        - cpu-load
        - memory
        - it-energy
        - facility-energy
        - energy-kwh
        - operational-carbon
        - host-share
        - embodied-carbon
        - carbon
        - sci
      defaults:
        cloud/provider: gcp
        cloud/region: us-east1
        cpu/watts-min: 0.8140104166666666
        cpu/watts-max: 4.3816792499999995
        memory/watts-per-gb: 0.392
        pue: 1.1
        grid/carbon-intensity: 579.44
        host/vcpus: 224
      inputs:
      - timestamp: '2026-10-18T20:16:57+00:00'
        duration: 242.958
        cpu/vcpus: 2
        cpu/busy-seconds: 387.778
        memory/gb-seconds: 96.609
        release-checks: 1
