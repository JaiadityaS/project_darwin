# ΔM scenario (§13.3): the CPU floor rises from x86-64-v1 to x86-64-v3 (AVX2, BMI2, FMA). The folk fix
# GGML_NATIVE=OFF gives this floor.
# A scenario, not a measurement. N is per 10,000 x86 users in scope: a unit, not a count of real users.
dimension: cpu
change: "x86-64-v1 -> x86-64-v3"
n_affected:
  low: 245
  high: 286
  source: >-
    Per 10,000 x86 users: the share of Steam Hardware Survey machines without BMI2 (the x86-64-v3 feature
    with the lowest share) among the machines with SSE2 (x86), September 2026: 1 - 95.91/98.32; August
    2026, from the change column: 1 - 95.34/98.15. A lower bound: a CPU without another v3 feature also
    fails. The survey skews toward newer machines.
e_kgco2e:
  low: 123.4
  high: 230.9
  source: >-
    Dell product carbon footprints, manufacture plus transport to the customer: Latitude 7300 25th
    Anniversary Edition (GaBi 9, October 2019) 109.9 + 13.5 kg; Latitude 3550 (PAIA, December 2018)
    263 kg x (81.8% + 6.0%).
p: [0.01, 0.02, 0.05]
delta_years:
  low: 0.5
  high: 2
  source: >-
    Reasoning: the newest affected devices are budget laptops with a CPU without AVX, such as the Celeron
    N4020 (Intel ARK: SSE4.2 only; launched Q4 2019). A laptop bought with one in 2022 has about 1 to 2 years
    left at a life of 4 to 5 years. Older devices, such as CPUs from before 2013, have less.
lifespan_years:
  low: 4
  high: 5
  source: "The product lifetimes in the two Dell product carbon footprints above: 4 years (Latitude 3550), 5 years (Latitude 7300)."
