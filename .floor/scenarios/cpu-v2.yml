# ΔM scenario (§13.3): the CPU floor rises from x86-64-v1 to x86-64-v2 (SSE4.2, POPCNT, CMPXCHG16B). A build
# without ggml's baseline CPU variant (libggml-cpu-x64.so) gives this floor: its lowest variant is sse42.
# A scenario, not a measurement. N is per 10,000 x86 users in scope: a unit, not a count of real users.
dimension: cpu
change: "x86-64-v1 -> x86-64-v2"
n_affected:
  low: 11
  high: 12
  source: >-
    Per 10,000 x86 users: the share of Steam Hardware Survey machines without SSE4.2 (the x86-64-v2 feature
    with the lowest share) among the machines with SSE2 (x86), September 2026: 1 - 98.21/98.32; August
    2026, from the change column: 1 - 98.03/98.15. A lower bound: a CPU without another v2 feature also
    fails. The survey skews toward newer machines.
e_kgco2e:
  low: 123.4
  high: 230.9
  source: >-
    Dell product carbon footprints, manufacture plus transport to the customer: Latitude 7300 25th
    Anniversary Edition (GaBi 9, October 2019) 109.9 + 13.5 kg; Latitude 3550 (PAIA, December 2018)
    263 kg x (81.8% + 6.0%).
p: [0.01, 0.02, 0.05]
delta_years:
  low: 0.25
  high: 1
  source: >-
    Reasoning: the newest affected devices are netbooks and small PCs with a 64-bit CPU without SSE4.2, such
    as the Atom N2800 (Intel ARK: SSE2, SSE3 and SSSE3 only; launched Q4 2011). In 2026 such a device is
    about 14 years old, past a life of 4 to 5 years, so little of its useful life is left.
lifespan_years:
  low: 4
  high: 5
  source: "The product lifetimes in the two Dell product carbon footprints above: 4 years (Latitude 3550), 5 years (Latitude 7300)."
