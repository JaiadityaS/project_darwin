# ΔM scenario (§13.3): the CPU floor rises from x86-64-v1 to x86-64-v4 (AVX-512). Upstream's recipe gives
# this floor on an AVX-512 build machine, as for the image main-a1867e0 and on the GitLab runner.
# A scenario, not a measurement. N is per 10,000 x86 users in scope: a unit, not a count of real users.
dimension: cpu
change: "x86-64-v1 -> x86-64-v4"
n_affected:
  low: 7207
  high: 7565
  source: >-
    Per 10,000 x86 users: the share of Steam Hardware Survey machines without AVX512F among the machines
    with SSE2 (x86), September 2026: 1 - 27.46/98.32; August 2026, from the change column: 1 - 23.90/98.15.
    The survey skews toward newer machines, so N is likely understated.
e_kgco2e:
  low: 123.4
  high: 230.9
  source: >-
    Dell product carbon footprints, manufacture plus transport to the customer: Latitude 7300 25th
    Anniversary Edition (GaBi 9, October 2019) 109.9 + 13.5 kg; Latitude 3550 (PAIA, December 2018)
    263 kg x (81.8% + 6.0%).
p: [0.01, 0.02, 0.05]
delta_years:
  low: 0.5
  high: 5
  source: >-
    New devices are affected too: Intel ARK lists AVX2 but no AVX-512 for the Core Ultra 7 155H (launched
    Q4 2023). So the life cut short is from half a year (a device near its end of life) to a whole life.
lifespan_years:
  low: 4
  high: 5
  source: "The product lifetimes in the two Dell product carbon footprints above: 4 years (Latitude 3550), 5 years (Latitude 7300)."
